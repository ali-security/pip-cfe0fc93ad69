name: CI

on:
  workflow_dispatch:
    # allow manual runs on branches without a PR

env:
  # The "FORCE_COLOR" variable, when set to 1,
  # tells Nox to colorize itself.
  FORCE_COLOR: "1"
  # Keep pytest's own output uncoloured so the "N passed" summary lines are
  # plain text in the job logs. pyproject.toml's addopts forces --color=yes
  # (and ships in the sdist, so it stays untouched); PYTEST_ADDOPTS is
  # applied after the ini addopts, so this overrides it.
  PYTEST_ADDOPTS: "--color=no"
  # The runner's current git starts detached auto-maintenance after
  # `git commit`, which transiently creates .git/objects/maintenance.lock
  # while scripttest snapshots the scratch tree (FileNotFoundError in
  # tests/functional/test_vcs_git.py). Env-level config survives the test
  # suite's HOME/system-config isolation.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s docs

  determine-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            vendoring:
              # Anything that's touching "vendored code"
              - "src/pip/_vendor/**"
              - "pyproject.toml"
              - "noxfile.py"
            tests:
              # Anything that's touching code-related stuff
              - ".github/workflows/ci.yml"
              - "src/**"
              - "tests/**"
              - "noxfile.py"
              # The test suite should also run when cutting a release
              # (which is the only time this file is modified).
              - "NEWS.rst"
        if: github.event_name == 'pull_request'

  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Set up git credentials
        run: |
          git config --global user.email "pypa-dev@googlegroups.com"
          git config --global user.name "pip"

      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s prepare-release -- 99.9
      - run: python -m nox -s build-release -- 99.9
      - run: pipx run check-sdist

  vendoring:
    name: vendoring
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.vendoring == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - run: python -m pip install .
      - run: python -m pip install nox
      - run: python -m nox -s vendoring
      # Sealed CVE-2026-133949: certifi/cacert.pem carries a patched trust store
      # while vendor.txt keeps certifi==2026.6.17, so re-vendoring certifi
      # always differs; exclude only certifi from the consistency diff.
      - run: git diff --exit-code -- . ':(exclude)src/pip/_vendor/certifi'

  tests-unix:
    name: tests / ${{ matrix.python.version || matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          # Pinned to the prerelease that existed when 26.2.1 was released;
          # a bare "3.15" now resolves to the final 3.15 release, which is
          # not what this release's CI tested against.
          - { key: "3.15", version: "3.15.0-beta.4" }
          - "3.14t"
        include:
          # Oldest patch release per minor version on ubuntu-latest,
          # to catch backport/bug fix regressions. Constrained by what
          # actions/setup-python ships for the runner OS (ubuntu-24.04).
          # See: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          # ubuntu-latest moved to 26.04, for which setup-python ships none of
          # these old patch releases; pin the runner the comment above names.
          - os: ubuntu-24.04
            python: { key: "3.10", version: "3.10.4" }
          - os: ubuntu-24.04
            python: { key: "3.11", version: "3.11.0" }
          - os: ubuntu-24.04
            python: { key: "3.12", version: "3.12.0" }
          - os: ubuntu-24.04
            python: { key: "3.13", version: "3.13.0" }
          - os: ubuntu-24.04
            python: { key: "3.14", version: "3.14.0" }

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python.version || matrix.python }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python.version || matrix.python, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install brz subversion
          # Mercurial: the ubuntu-24.04 image ships hg but ubuntu-latest
          # (26.04) does not; without it the @need_mercurial tests skip.
          sudo apt-get install mercurial

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          # mercurial: not preinstalled on the macOS image; without it the
          # @need_mercurial tests skip.
          DEPS="breezy mercurial"
          if ! which svn; then
            DEPS="${DEPS} subversion"
          fi
          brew install ${DEPS}

      # The system bzr/hg run on the system Python, but the test environment
      # leaks into them: Ubuntu's brz binary embeds libpython and resolves its
      # Python from PATH (and loads setup-python's libpython via
      # LD_LIBRARY_PATH when the minor versions match), so inside the nox venv
      # it cannot import breezy (pypa/pip#13568), and PYTHON_GIL=0 from the free-threaded legs aborts
      # a regular (GIL) CPython 3.13+ at startup. Without these wrappers the
      # @need_bzr / @need_mercurial tests skip as "not available".
      - name: Run VCS tools against their own Python
        run: |
          mkdir -p "$RUNNER_TEMP/vcs-bin"
          if [ "$RUNNER_OS" = Linux ]; then
            ISOLATE='env -u PYTHON_GIL -u VIRTUAL_ENV -u LD_LIBRARY_PATH PATH=/usr/bin:/bin'
          else
            ISOLATE='env -u PYTHON_GIL'
          fi
          for tool in bzr hg; do
            real="$(command -v "$tool")"
            printf '#!/bin/sh\nexec %s "%s" "$@"\n' "$ISOLATE" "$real" > "$RUNNER_TEMP/vcs-bin/$tool"
            chmod +x "$RUNNER_TEMP/vcs-bin/$tool"
            cat "$RUNNER_TEMP/vcs-bin/$tool"
            "$RUNNER_TEMP/vcs-bin/$tool" version
          done
          echo "$RUNNER_TEMP/vcs-bin" >> "$GITHUB_PATH"

      - run: python -m pip install .
      - run: python -m pip install nox

      # Python 3.15 is pinned to a release-era beta; test dependencies
      # published later (markupsafe cp315 wheels, cryptography abi3t wheels)
      # are built against the final 3.15 ABI that the beta cannot load.
      # Pre-provision the nox env from the registry as of the 26.2.1 release
      # date, and reuse that env below so PIP_INDEX_URL never reaches the
      # test runs.
      - name: Pre-install test environment (3.15 beta)
        if: matrix.python.key == '3.15'
        env:
          PIP_INDEX_URL: https://:2026-08-04T22:51:12.472093Z@time-machines-pypi.sealsecurity.io/
        run: python -m nox -s test-3.15 --install-only

      # Main check
      - name: Run unit tests
        run: >-
          python -m nox -s test-${{ matrix.python.key || matrix.python }} ${{ matrix.python.key == '3.15' && '--no-install' || '' }} --
          tests/unit
          --verbose --numprocesses auto --showlocals
      - name: Run integration tests
        run: >-
          python -m nox -s test-${{ matrix.python.key || matrix.python }} --no-install --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15

  tests-windows:
    name: tests / ${{ matrix.python.key || matrix.python }} / ${{ matrix.os }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 50

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [Windows]
        python:
          - "3.10"
          # Commented out, since Windows tests are expensively slow,
          # only test the oldest and newest Python supported by pip
          # - "3.11"
          # - "3.12"
          # - "3.13"
          - "3.14"
          # Pinned to the prerelease that existed when 26.2.1 was released;
          # a bare "3.15" now resolves to the final 3.15 release, which is
          # not what this release's CI tested against.
          - { key: "3.15", version: "3.15.0-beta.4" }
          - "3.14t"
        # Windows is slow, so shard unit + functional across runners, split by a
        # stable hash of each test's node id (see --num-test-groups in conftest).
        group: [1, 2, 3]

    steps:
      # The D: drive is significantly faster than the system C: drive.
      # https://github.com/actions/runner-images/issues/8755
      - name: Set TEMP to D:/Temp
        run: |
          mkdir "D:\\Temp"
          echo "TEMP=D:\\Temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python.version || matrix.python }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python.version || matrix.python, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Subversion
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            winget source reset --force
            winget source update winget
            winget install --source winget --accept-source-agreements --accept-package-agreements -e --id Slik.Subversion
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $i)
          }
          echo "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Mercurial is not preinstalled on the Windows image; without it the
      # @need_mercurial tests skip. Same retry pattern as Subversion above.
      - name: Install Mercurial
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            winget install --source winget --accept-source-agreements --accept-package-agreements -e --id Mercurial.Mercurial
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $i)
          }
          echo "C:\Program Files\Mercurial" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Bazaar (breezy) is not on the Windows image; without it the @need_bzr
      # tests skip. Install it into its own venv on a GIL-enabled 3.12 (which
      # ignores PYTHON_GIL from the free-threaded legs) and expose only a
      # bzr.exe, so the venv's python/pip never shadow the matrix Python.
      - name: Set up Python for Bazaar
        id: bzr-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          update-environment: false
      - name: Install Bazaar
        shell: pwsh
        run: |
          & "${{ steps.bzr-python.outputs.python-path }}" -m venv D:\bzr-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          D:\bzr-venv\Scripts\python.exe -m pip install breezy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force D:\bzr-bin | Out-Null
          Copy-Item D:\bzr-venv\Scripts\brz.exe D:\bzr-bin\bzr.exe
          D:\bzr-bin\bzr.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "D:\bzr-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: python -m pip install .
      - run: python -m pip install nox

      # Python 3.15 is pinned to a release-era beta; test dependencies
      # published later (markupsafe cp315 wheels, cryptography abi3t wheels)
      # are built against the final 3.15 ABI that the beta cannot load.
      # Pre-provision the nox env from the registry as of the 26.2.1 release
      # date, and reuse that env below so PIP_INDEX_URL never reaches the
      # test runs.
      - name: Pre-install test environment (3.15 beta)
        if: matrix.python.key == '3.15'
        env:
          PIP_INDEX_URL: https://:2026-08-04T22:51:12.472093Z@time-machines-pypi.sealsecurity.io/
        run: python -m nox -s test-3.15 --install-only

      # Main check. worksteal rebalances the long tail of slow install tests
      # onto idle workers:
      # https://pytest-xdist.readthedocs.io/en/stable/distribution.html
      - name: Run tests (shard ${{ matrix.group }} of 3)
        run: >-
          python -m nox -s test-${{ matrix.python.key || matrix.python }} ${{ matrix.python.key == '3.15' && '--no-install' || '' }} --
          tests/unit tests/functional
          --num-test-groups 3 --test-group ${{ matrix.group }}
          --verbose --numprocesses auto --showlocals --durations=15
          --dist worksteal

  tests-zipapp:
    name: tests / zipapp
    # The macos-latest (M1) runners are the fastest available on GHA, even
    # beating out the ubuntu-latest runners. The zipapp tests are slow by
    # nature, and we don't care where they run, so we pick the fastest one.
    runs-on: macos-latest
    timeout-minutes: 40

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install MacOS dependencies
        run: brew install breezy subversion mercurial

      - run: python -m pip install .
      - run: python -m pip install nox

      # Main check
      - name: Run integration tests
        run: >-
          python -m nox -s test-3.10 --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=15
          --use-zipapp

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - determine-changes
      - docs
      - packaging
      - tests-unix
      - tests-windows
      - tests-zipapp
      - vendoring

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: >-
            ${{
              (
                needs.determine-changes.outputs.vendoring != 'true'
                && github.event_name == 'pull_request'
              )
              && 'vendoring'
              || ''
            }}
            ,
            ${{
              (
                needs.determine-changes.outputs.tests != 'true'
                && github.event_name == 'pull_request'
              )
              && '
                tests-unix,
                tests-windows,
                tests-zipapp,
                tests-importlib-metadata,
              '
              || ''
            }}
          jobs: ${{ toJSON(needs) }}
